name: Sync Vietlott results

on:
  schedule:
    # GitHub silently drops scheduled runs on shared runners when the queue is busy, and
    # high-frequency crons on the hour are hit hardest - a '*/15' schedule here actually
    # fired 13 times in 4 days. Twice an hour at odd minutes gets scheduled far more
    # reliably. Draws are at most a few times a day, so this is plenty.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-vietlott-results
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - run: npm run scrape
        env:
          # Optional. Only set this repo secret if the runner's own IP is Cloudflare-blocked;
          # an empty value means a direct connection.
          SCRAPE_PROXY_URL: ${{ secrets.SCRAPE_PROXY_URL }}

      - name: Commit and push if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes, skipping commit."
          else
            git commit -m "Update lottery results ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          fi
